name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: LowdriftKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Privacy audit
        run: ./scripts/privacy-audit.sh
      - name: swift test
        working-directory: LowdriftKit
        run: swift test

  package-macos:
    name: LowdriftKit tests (macOS, incl. AVAudioEngine)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: swift test
        working-directory: LowdriftKit
        run: swift test

  app-ios:
    name: App build + simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Build and test
        run: mkdir -p build && ./scripts/ci-ios.sh
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/Tests.xcresult
            build/xcodebuild-build.log
          if-no-files-found: ignore
